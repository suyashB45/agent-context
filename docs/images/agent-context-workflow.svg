<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc">
<title id="title">The Agent Context handoff workflow</title><desc id="desc">Read project context, claim a task with a lease, record progress and decisions, then record a handoff and complete or release the task. The next agent repeats the loop using the same project ID. Agents must call the tools; conversations are not captured automatically.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 10 5-10 5Z" fill="#80a38d"/></marker></defs>
<rect width="1280" height="410" rx="22" fill="#0c120f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#edf4ef">
<text x="48" y="57" font-family="monospace" font-size="12" fill="#a5efc8" letter-spacing="2">ONE PROJECT ID. A SHARED RECORD.</text><text x="48" y="101" font-size="31" font-weight="600">A useful handoff becomes the next starting point.</text>
<g stroke="#304138" fill="#121c16"><rect x="48" y="139" width="265" height="161" rx="10"/><rect x="354" y="139" width="265" height="161" rx="10"/><rect x="660" y="139" width="265" height="161" rx="10"/><rect x="966" y="139" width="265" height="161" rx="10"/></g>
<g fill="none" stroke="#80a38d" marker-end="url(#arrow)"><path d="M321 218h24"/><path d="M627 218h24"/><path d="M933 218h24"/></g>
<g font-family="monospace" font-size="12" fill="#a5efc8"><text x="70" y="169">01 / READ</text><text x="376" y="169">02 / CLAIM</text><text x="682" y="169">03 / RECORD</text><text x="988" y="169">04 / HANDOFF</text></g>
<g font-size="20" font-weight="600"><text x="70" y="207">Read context</text><text x="376" y="207">Claim a task</text><text x="682" y="207">Record progress</text><text x="988" y="207">Leave a handoff</text></g>
<g font-size="14" fill="#a2b1a8"><text x="70" y="238">Read memory and open tasks</text><text x="70" y="260">before editing the project.</text><text x="376" y="238">Use the current version.</text><text x="376" y="260">Renew the expiring lease.</text><text x="682" y="238">Save decisions, changed files</text><text x="682" y="260">and exact test results.</text><text x="988" y="238">Record the next steps.</text><text x="988" y="260">Complete or release the task.</text></g>
<path d="M1098 310v28H181v-28" stroke="#385542" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/><rect x="480" y="322" width="320" height="29" rx="14" fill="#1a2c21"/><text x="640" y="341" text-anchor="middle" font-family="monospace" font-size="12" fill="#a5efc8">The next agent reads the same project</text><text x="640" y="382" text-anchor="middle" font-size="13" fill="#a2b1a8">Agents must record their work. No automatic conversation capture. Task claims do not lock source files.</text>
</g></svg>
