<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Agent Context — shared memory for coding agents</title>
<desc id="desc">Illustrative dashboard with example projects, task claims, a recorded handoff, and two agents sharing a local SQLite project record. This is example data, not a screenshot of a live instance.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b15"/><stop offset="1" stop-color="#090d0c"/></linearGradient><radialGradient id="glow"><stop stop-color="#a5efc8" stop-opacity=".10"/><stop offset="1" stop-color="#a5efc8" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#26332d" stroke-opacity=".4"/></pattern></defs>
<rect width="1280" height="720" rx="24" fill="url(#bg)"/><rect width="1280" height="720" rx="24" fill="url(#grid)"/><ellipse cx="1100" cy="150" rx="520" ry="350" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#edf4ef">
<g transform="translate(48 40)" stroke="#a5efc8" stroke-width="2" fill="none"><path d="m18 0 17 10v20L18 40 1 30V10Z"/><path d="m1 10 17 10 17-10M18 20v20"/></g>
<text x="98" y="69" font-size="27" font-weight="600">Agent Context</text><rect x="1054" y="44" width="178" height="30" rx="15" fill="#14271d" stroke="#324c3c"/><text x="1143" y="64" text-anchor="middle" font-family="monospace" font-size="12" fill="#a5efc8">v0.4.0 · early release</text>
<text x="48" y="138" font-size="38" font-weight="600" letter-spacing="-1">Shared memory for your coding agents.</text><text x="49" y="173" font-size="18" fill="#a2b1a8">One agent records the work. The next reads the context before continuing.</text>
<rect x="48" y="213" width="1184" height="419" rx="13" fill="#101614" stroke="#304138"/>
<path d="M61 213h1158q13 0 13 13v30H48v-30q0-13 13-13" fill="#17201c"/><circle cx="70" cy="235" r="4" fill="#ec8679"/><circle cx="85" cy="235" r="4" fill="#d8b876"/><circle cx="100" cy="235" r="4" fill="#88bd9b"/>
<text x="640" y="240" text-anchor="middle" font-family="monospace" font-size="12" fill="#a2b1a8">127.0.0.1:8765/dashboard</text><text x="1137" y="240" text-anchor="middle" font-size="12" fill="#a5efc8">Example data</text>
<path d="M275 256v376" stroke="#26332d"/><text x="72" y="295" font-size="17" font-weight="600">Workspace</text>
<rect x="64" y="316" width="195" height="38" rx="6" fill="#20362a"/><text x="82" y="341" font-size="14" fill="#a5efc8">Projects</text><text x="82" y="385" font-size="14" fill="#a2b1a8">Tasks</text><text x="82" y="429" font-size="14" fill="#a2b1a8">Agents</text><text x="82" y="473" font-size="14" fill="#a2b1a8">Activity</text><text x="82" y="517" font-size="14" fill="#a2b1a8">Connect agents</text><circle cx="83" cy="598" r="4" fill="#a5efc8"/><text x="97" y="603" font-family="monospace" font-size="11" fill="#a2b1a8">Local SQLite</text>
<text x="307" y="292" font-family="monospace" font-size="11" fill="#a5efc8" letter-spacing="2">PROJECT / LAUNCHPAD</text><text x="307" y="326" font-size="26" font-weight="600">Continue with context.</text>
<rect x="307" y="351" width="522" height="109" rx="8" fill="#14201a" stroke="#304138"/><text x="327" y="378" font-family="monospace" font-size="11" fill="#a5efc8">LATEST HANDOFF · AGENT A</text><text x="327" y="408" font-size="17">Session validation is ready for review.</text><text x="327" y="435" font-size="13" fill="#a2b1a8">Recorded: decisions, changed files, test results and next steps.</text>
<rect x="307" y="480" width="522" height="118" rx="8" fill="#0d1310" stroke="#26332d"/><text x="327" y="507" font-family="monospace" font-size="11" fill="#a2b1a8">CURRENT TASK</text><text x="327" y="537" font-size="17">Connect the login screen</text><text x="327" y="570" font-family="monospace" font-size="12" fill="#a5efc8">agent-b · lease active · optimistic version</text>
<rect x="851" y="351" width="349" height="247" rx="8" fill="#0d1310" stroke="#26332d"/><text x="872" y="380" font-family="monospace" font-size="11" fill="#a2b1a8">SHARED PROJECT MEMORY</text>
<rect x="873" y="406" width="35" height="35" rx="7" fill="#20362a"/><text x="890" y="429" text-anchor="middle" font-family="monospace" font-size="15" fill="#a5efc8">A</text><text x="923" y="424" font-size="14">Record the handoff</text><text x="923" y="446" font-family="monospace" font-size="11" fill="#a2b1a8">record_update(kind="handoff")</text>
