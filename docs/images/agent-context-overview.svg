<rect x="873" y="498" width="35" height="35" rx="7" fill="#20362a"/><text x="890" y="521" text-anchor="middle" font-family="monospace" font-size="15" fill="#a5efc8">B</text><text x="923" y="516" font-size="14">Read before continuing</text><text x="923" y="538" font-family="monospace" font-size="11" fill="#a2b1a8">get_context(project_id)</text><text x="872" y="576" font-size="11" fill="#a2b1a8">Agent IDs are self-reported.</text>
