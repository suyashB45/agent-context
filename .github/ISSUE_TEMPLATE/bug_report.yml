name: Bug report
description: Report a reproducible problem without including secrets or private context.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a temporary database and remove tokens or private project content.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Package version, Node version, OS, and installation method
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Redact credentials, private paths, handoffs, and database contents.
