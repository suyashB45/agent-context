name: Verify React and npm release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --offline=false --ignore-scripts --no-audit --no-fund
      - run: npm run build:runtime
      - run: npm run check
      - run: npm run docs:check
      - run: npm test
        timeout-minutes: 5
      - run: node -e "require('node:fs').mkdirSync('dist/npm',{recursive:true})"
      - run: npm pack --pack-destination dist/npm
      - run: npm run test:package
      - run: npm run release:source
      - run: npm run site:build
      - run: npm run site:check
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: npm-package
          path: dist/npm/*.tgz
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: launch-site-and-source
          path: |
            out/
            dist/release/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --offline=false --ignore-scripts --no-audit --no-fund
      - run: docker build -t agent-context:ci .
      - run: node scripts/test-container.mjs
        timeout-minutes: 3
